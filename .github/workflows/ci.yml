name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          pip install uv

      - name: Create virtual environment and install dependencies
        run: |
          uv venv .venv
          uv pip install -r requirements.txt

      - name: Configure DVC remote (local, CI skip pull)
        run: |
          # In CI we do not have DVC remote access so we skip dvc pull.
          # Tests use synthetic data and do not need the real dataset.
          echo "DVC remote not available in CI; skipping dvc pull."

      - name: Run Pytest
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
